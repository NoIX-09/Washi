server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 字体每次构建重算，**不能 immutable**
    #
    # 字体子集现在是构建产物：文件名不变（wenkai-regular.woff2），内容却随内容更新而变。
    # 回访者若拿着 30 天 immutable 的旧子集，新写的字会掉成系统字体，而且**刷新不掉** ——
    # immutable 的语义就是「别来问我」。
    #
    # ^~ 前缀匹配才能压过下面的扩展名正则（普通前缀会被正则抢走）。
    # 这一条同时覆盖 woff2 和 fonts.css：后者同样随构建而变，
    # 若它被下面那条 .css 规则按 immutable 缓存 7 天，就会指向已经变了的 woff2。
    #
    # 刻意**不写 expires**：expires 自己会发一条 Cache-Control: max-age=…，
    # 和下面的 add_header 并存就是两条自相矛盾的响应头。
    # 配合 nginx 自带的 ETag/Last-Modified：没变 → 304，变了 → 200 新字节。
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=600, must-revalidate";
    }

    # Cache policy
    location ~* \.(jpg|jpeg|png|gif|svg|ico|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Root redirect: / -> /zh-CN/home (real 301, no HTML download, browser-cacheable)
    location = / {
        return 301 /zh-CN/home;
    }

    # Static files
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
